    <div class="container">
        <form action="https://api.web3forms.com/submit" method="POST">
            <h2>Contact Form</h2>
            <input type="hidden" name="access_key" value="b62f9deb-2139-486b-9288-a5fe9246e333">
            <label for="fname">Your Name : </label>
            <input type="text" placeholder="Your Full Name" id="fname" name="name" required>
            <label for="Email">Your Email : </label>
            <input type="email" placeholder="you@example.com" id="Email" name="email" required>
            <label for="message">Message : </label>
            <textarea name="message" id="message" placeholder="Your message" required></textarea>

            <label for="subject">Subject</label>
            <select id="subject" name="subject">
                <option value="job">Job Enquiry</option>
                <option value="services">Join Services</option>
            </select>
            <button type="submit" class="btn primary">Send</button>
        </form>
    </div>
